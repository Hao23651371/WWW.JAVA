plugins {
    id 'java'
    id 'war'
}

group 'vn.fit'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '5.10.2'
}

sourceCompatibility = '17'
targetCompatibility = '17'

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

dependencies {
    // Servlet API cho Tomcat 10
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'

    // CDI API
    compileOnly 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.0.1'

    // Weld Servlet cho CDI trên Tomcat 10
    implementation 'org.jboss.weld.servlet:weld-servlet-core:5.1.2.Final'

    // Jersey REST Engine & JSON Jackson binding
    implementation 'org.glassfish.jersey.containers:jersey-container-servlet:3.1.5'
    implementation 'org.glassfish.jersey.inject:jersey-hk2:3.1.5'
    // Bridge Jersey to the CDI container already started by Weld Servlet.
    implementation 'org.glassfish.jersey.ext.cdi:jersey-cdi1x:3.1.5'
    implementation 'org.glassfish.jersey.ext.cdi:jersey-cdi1x-servlet:3.1.5'
    implementation 'org.glassfish.jersey.media:jersey-media-json-jackson:3.1.5'

    // MariaDB Connector
    implementation 'org.mariadb.jdbc:mariadb-java-client:3.3.3'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
}

test {
    useJUnitPlatform()
}
